apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-agent-deployment
  labels:
    name:  ai-agent-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  ai-agent
  template:
    metadata:
      labels:
        app:  ai-agent
    spec:
      containers:
      - image:  ai-agent
        env:
          - name:  GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name:  gemini-secret
                key:  GEMINI_API_KEY
        name:  ai-agent
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: api/ai/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: api/ai/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        ports:
        - containerPort:  3000
          name:  ai-server-port
